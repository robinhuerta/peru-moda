name: Deploy to Vercel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Deploying with Project ID: $VERCEL_PROJECT_ID"
            npx vercel --prod --token $VERCEL_TOKEN --confirm --project $VERCEL_PROJECT_ID ${VERCEL_ORG_ID:+--scope $VERCEL_ORG_ID}
          else
            echo "Deploying without specific project ID"
            npx vercel --prod --token $VERCEL_TOKEN --confirm
          fi
